<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Obóz 2027 – logowanie</title>
<style>:root{color-scheme:light dark;--bg:light-dark(#f5f5f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#1d1d1f,#f5f5f7);--sub:light-dark(#6e6e73,#98989d);--fill:light-dark(rgba(118,118,128,.12),rgba(118,118,128,.24));--blue:#0a84ff;--red:#ff3b30}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.47 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--card);border-radius:22px;padding:32px 26px 26px;box-shadow:0 10px 40px rgba(0,0,0,.08),0 0 0 .5px rgba(128,128,128,.2)}
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0 0 6px}p{margin:0 0 22px;color:var(--sub);font-size:15px}
label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px}input[type=text],input[type=password]{width:100%;font:17px system-ui;padding:12px 14px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);margin-bottom:14px}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.rem{display:flex;gap:8px;align-items:center;font-size:15px;margin:2px 0 18px}
button{width:100%;font:600 17px system-ui;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer}button:active{transform:scale(.98)}button:disabled{opacity:.6}
.err{color:var(--red);font-size:15px;min-height:22px;margin-top:12px}form.shake{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(prefers-reduced-motion:reduce){form.shake{animation:none}}</style></head><body>
<form id="f" autocomplete="on"><h1>Obóz 2027</h1><p>Miejsca obozowe 9 SDH „Echo Puszczy”. Zaloguj się, żeby zobaczyć mapę.</p>
<label for="u">Nazwa użytkownika</label><input id="u" type="text" autocomplete="username" autocapitalize="characters" required>
<label for="p">Hasło</label><input id="p" type="password" autocomplete="current-password" required>
<label class="rem"><input id="r" type="checkbox"> Zapamiętaj na tym urządzeniu</label>
<button id="b">Zaloguj się</button><div class="err" id="e" role="alert"></div></form>
