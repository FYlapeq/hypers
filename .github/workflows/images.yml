name: Zdjęcia do newsów

on:
  push:
    branches: [main]
    paths: ['data/editions.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fetch-images.mjs
      - name: Zapisz zdjęcia
        run: |
          if [ -n "$(git status --porcelain img data)" ]; then
            git config user.name "hypers-bot"
            git config user.email "hypers-bot@users.noreply.github.com"
            git add img data/editions.js
            git commit -m "Zdjęcia do newsów"
            git pull --rebase origin main
            git push
          else
            echo "Brak nowych zdjęć"
          fi
