# Posty na Instagramie: jeden news = jeden post, o godzinach z instagram/harmonogram.json (czas Warszawy).
# Tryb zegar (push wydania, cron, łańcuch): job czeka do pełnej godziny slotu i publikuje o czasie (instagram/zegar.sh).
# Cron co 15 min to tylko zapas, gdy łańcuch się zerwie (harmonogram GitHuba bywa spóźniony o godziny).
# Post wychodzi tylko z oryginalną miniaturą filmu; news bez niej jest pomijany. Instrukcja: instagram/README.md
name: Instagram
on:
  workflow_dispatch:
    inputs:
      tryb:
        description: "proba = podgląd kart dnia, sprawdz = test tokenu, publikuj = slot z harmonogramu (jeśli przypada) albo news z pola tylko, zegar = czekaj na sloty i publikuj o pełnej godzinie"
        type: choice
        options: ["proba", "sprawdz", "publikuj", "zegar"]
        default: "proba"
      tylko:
        description: "Opcjonalnie: ścieżka jednego artykułu do opublikowania (np. artykuly/2026-10-15/slug.html), także już pominiętego"
        type: string
        required: false
      dzien:
        description: "Dla trybu proba: dzień do podglądu (RRRR-MM-DD), puste = najnowsze wydanie"
        type: string
        required: false
  push:
    branches: [main]
    paths: ['data/editions.js']      # nowe wydanie uruchamia zegar
  schedule:
    - cron: '7,22,37,52 * * * *'     # zapas co 15 min (nie o pełnej godzinie, wtedy GitHub najbardziej się spóźnia)
    - cron: '17 3 * * 1'             # poniedziałek: odświeżenie tokenu (ważny 60 dni)
permissions:
  contents: write
  actions: write   # zegar uruchamia swojego następcę
concurrency:
  # Zegar trzyma grupę „instagram” godzinami; próba i test tokenu nic nie publikują, więc mają własną grupę.
  group: ${{ (github.event_name == 'workflow_dispatch' && (inputs.tryb == 'proba' || inputs.tryb == 'sprawdz')) && 'instagram-proba' || 'instagram' }}
  cancel-in-progress: false

jobs:
  sprawdz:
    if: github.event_name == 'workflow_dispatch' && inputs.tryb == 'sprawdz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: instagram
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sprawdź token Instagrama
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node instagram/sprawdz.mjs

  posty:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '17 3 * * 1') ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tryb != 'sprawdz')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_WARIANT: ${{ vars.IG_WARIANT || 'e' }}
      IG_KADRY: ${{ vars.IG_KADRY || '1' }}
      IG_WLACZONY: ${{ vars.IG_WLACZONY || '0' }}
      IG_TYLKO: ${{ github.event_name == 'workflow_dispatch' && inputs.tryb == 'publikuj' && inputs.tylko || '' }}
      IG_TRYB: slot
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.tryb == 'proba') && '1' || '0' }}
      ZEGAR: ${{ (github.event_name != 'workflow_dispatch' || inputs.tryb == 'zegar') && '1' || '0' }}
      STAN_DIR: ${{ github.workspace }}/ig-stan
    steps:
      - name: Wyłącznik
        id: wl
        run: |
          if [ "$DRY_RUN" = "1" ] || [ "$IG_WLACZONY" = "1" ]; then echo "dziala=1" >> "$GITHUB_OUTPUT"
          else echo "Publikacja wyłączona: zmienna repo IG_WLACZONY != 1." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v4
        if: steps.wl.outputs.dziala == '1'
        with:
          ref: main
      - name: Stan z gałęzi instagram (świeża gałąź bez historii)
        if: steps.wl.outputs.dziala == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$STAN_DIR" && cd "$STAN_DIR"
          git init -q -b instagram
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin instagram; then
            git checkout -q FETCH_HEAD -- opublikowane.json && echo "Stan wczytany." || echo "Brak pliku stanu."
          else
            echo "Gałąź instagram jeszcze nie istnieje: pierwsze uruchomienie oznaczy archiwum jako pominięte."
          fi
      - name: Czy teraz jest slot?
        id: slot
        if: steps.wl.outputs.dziala == '1'
        run: |
          if [ "$DRY_RUN" = "1" ] || [ -n "$IG_TYLKO" ] || [ ! -f "$STAN_DIR/opublikowane.json" ]; then echo "teraz=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ZEGAR" = "1" ]; then
            N=$(node instagram/slot.mjs nastepny "$STAN_DIR/opublikowane.json")
            if [ -n "$N" ]; then echo "Zegar: najbliższy slot $N (klucz, sekundy)"; echo "teraz=1" >> "$GITHUB_OUTPUT"; else echo "Zegar: na dziś nic nie zostało."; fi
            exit 0
          fi
          K=$(node instagram/slot.mjs "$STAN_DIR/opublikowane.json")
          if [ -n "$K" ]; then echo "Slot do zrobienia: $K"; echo "teraz=1" >> "$GITHUB_OUTPUT"; else echo "Brak slotu teraz."; fi
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.teraz == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: instagram/package-lock.json
      - name: Zależności i Chromium
        if: steps.slot.outputs.teraz == '1'
        working-directory: instagram
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Podgląd (tryb próba)
        if: steps.slot.outputs.teraz == '1' && env.DRY_RUN == '1'
        env:
          DZIEN: ${{ inputs.dzien }}
        run: |
          D="${DZIEN:-$(node -e "const v=require('vm'),c={window:{}};v.runInNewContext(require('fs').readFileSync('data/editions.js','utf8'),c);console.log(Object.keys(c.window.HYPERS_EDITIONS).sort().at(-1))")}"
          IG_TRYB= IG_PODGLAD_DATA="$D" node instagram/publikuj.mjs
          # Podgląd także na gałęzi instagram-podglad (nadpisywana), do obejrzenia na GitHubie bez pobierania.
          cd "$STAN_DIR/karty"
          git init -q -b instagram-podglad
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Podgląd Instagram $D"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:instagram-podglad
          rm -rf .git
          echo "Podgląd kart z dnia $D: gałąź [instagram-podglad](https://github.com/${GITHUB_REPOSITORY}/tree/instagram-podglad)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publikacja
        if: steps.slot.outputs.teraz == '1' && env.DRY_RUN != '1' && env.ZEGAR != '1'
        run: node instagram/publikuj.mjs
      - name: Zegar (czeka do pełnej godziny slotu i publikuje)
        if: steps.slot.outputs.teraz == '1' && env.DRY_RUN != '1' && env.ZEGAR == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # kopia poza repo: zegar co slot odświeża main, a bash czyta skrypt w trakcie działania
        run: cp instagram/zegar.sh "$RUNNER_TEMP/zegar.sh" && bash "$RUNNER_TEMP/zegar.sh"

  token:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Odśwież token Instagrama
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.IG_SECRETS_PAT }}
        run: |
          if [ -z "$IG_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "Brak IG_TOKEN albo IG_SECRETS_PAT, pomijam."; exit 0; fi
          NOWY=$(curl -fsS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}" | jq -r .access_token)
          if [ -z "$NOWY" ] || [ "$NOWY" = "null" ]; then echo "::error::Nie udało się odświeżyć tokenu"; exit 1; fi
          echo "::add-mask::$NOWY"
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NOWY"
          echo "Token odświeżony." >> "$GITHUB_STEP_SUMMARY"
